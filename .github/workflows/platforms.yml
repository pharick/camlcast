# Does camlcast build where a player would run it?
#
# ci.yml stays the fast Linux gate and owns @fmt and @doc; this is the slower
# question of whether the SDL2 stack comes together on the other platforms. The
# two are separate files rather than one matrix because almost every step here
# would otherwise need an `if:` — macOS has to talk opam out of its depext check,
# and Windows needs a different Unix environment underneath it.
#
# Nothing here opens a window. Sdl.init lives in Engine alone and no test touches
# it, so the suites run headless on every runner. See test/dune.

name: Platforms

on:
  push:
    branches: [main]
  pull_request:
  # The Windows job below is a spike; being able to re-run it on demand, without
  # pushing, is the point of having it.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      # One architecture failing is a result, not a reason to stop asking about
      # the other.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # The last x86_64 image Actions offers. macos-13 was retired in
          # December 2025, and this one goes in the autumn of 2027, so treat
          # macOS x64 as a target with an expiry date rather than a permanent one.
          - runner: macos-15-intel
            arch: x64

    steps:
      - uses: actions/checkout@v4

      # Homebrew's `sdl2` is an alias for the sdl2-compat formula, which puts
      # SDL2's ABI over SDL3. That is fine to build against — the sdl2.pc it
      # symlinks is what conf-sdl2 actually checks — but see --no-depexts below.
      - run: brew install sdl2 sdl2_image

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          dune-cache: true

      # --no-depexts, because opam cannot see what brew just installed. It tests
      # for a system package by name against `brew list --full-name`, which
      # reports the formula, sdl2-compat; the depext conf-sdl2 asks for is spelled
      # sdl2, which is only an alias and never appears in that list. So opam
      # concludes the dependency is missing however many times you install it.
      # The check that matters, `pkg-config sdl2`, does succeed — this skips a
      # broken test, not a real one. Upstream: opam-repository#30337.
      - run: opam install . --deps-only --with-test --no-depexts

      - run: opam exec -- dune build

      - run: opam exec -- dune runtest

  # A real gate, as of the run that turned every suite green. Getting here took
  # three fixes, and each one is load-bearing: tsdl-image pinned past its
  # -mwindows bug and past a system-string match that missed "mingw64" (both in
  # camlcast.opam.template), and the sdl2.pc sanitising below.
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
          # Not the default. opam's own Cygwin resolves SDL2 to Cygwin's
          # mingw64-x86_64-SDL2, which is 2.0.7 and dates from 2017 — below the
          # 2.0.18 tsdl asks for. MSYS2, preinstalled on the runner, has 2.32.
          windows-environment: msys2

      # SDL2's own pkg-config file is unusable by an OCaml program, so install
      # the depexts by hand — ahead of opam, which would otherwise install them
      # itself and leave nothing to correct — and correct them before tsdl reads
      # them.
      #
      # SDL2 puts `-lmingw32 -mwindows -lSDL2main` in sdl2.pc for C programs,
      # whose main() it renames to SDL_main. tsdl does none of that: it calls
      # SDL_SetMainReady instead, so SDL2main is dead weight. -lmingw32 is worse
      # than dead. tsdl bakes the --libs-only-l output into tsdl.cmxa as -cclib,
      # and ocamlopt puts a library's flags ahead of libasmrun.a, so ld reaches
      # libmingw32.a while wmain is still undefined. OCaml links with -municode,
      # so wmain is its entry point and its runtime is what should answer;
      # instead libmingw32.a answers first with the GUI-subsystem shim
      # ucrtexewin.o, which defines wmain and calls wWinMain. Nothing defines
      # wWinMain, and libasmrun.a's main.o is never reached. Hence
      # `undefined reference to wWinMain` from a program with no GUI entry point
      # and no SDL_main.
      #
      # No link flag can undo this: -cclib arrives after the archive's own
      # flags, and -mconsole only sets the subsystem, while the startup object
      # is chosen by -municode. The flags have to be gone before tsdl is built.
      - name: Install SDL2 and strip what tsdl must not link
        run: |
          C:\msys64\usr\bin\pacman.exe -Su --noconfirm `
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_image `
            mingw-w64-x86_64-libffi mingw-w64-x86_64-pkgconf
          $pc = 'C:\msys64\mingw64\lib\pkgconfig\sdl2.pc'
          (Get-Content $pc) `
            -replace '-lmingw32 ?', '' `
            -replace '-mwindows ?', '' `
            -replace '-lSDL2main ?', '' `
            -replace '-Dmain=SDL_main ?', '' | Set-Content $pc
          Select-String -Path $pc -Pattern '^(Libs|Cflags):'

      - run: opam install . --deps-only --with-test

      # One command confirms or kills the diagnosis above: this should now read
      # `-ltsdl_stubs -lSDL2`, with no -lmingw32 and no -lSDL2main. If they are
      # still there, the sanitising ran too late and tsdl needs a reinstall.
      - name: Show what tsdl baked into its archive
        run: opam exec -- ocamlobjinfo _opam/lib/tsdl/tsdl.cmxa | Select-String 'Extra C'

      - run: opam exec -- dune build

      - run: opam exec -- dune runtest
